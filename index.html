<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Ariane</title>
  <meta name="description" content="A simple love surprise from Daniel to Ariane.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <audio id="loveSong" src="assets/song.mp3" preload="auto" loop></audio>

  <main class="app">
    <section class="question-screen" id="questionScreen">
      <div class="soft-light"></div>
      <div class="question-card">
        <p class="tiny">A small question before the surprise</p>
        <h1>Hi love, will you open this little gift from me?</h1>
        <p class="question-copy" id="questionCopy">Click No first. I promise it is part of the surprise.</p>
        <div class="question-actions" id="questionActions">
          <button class="yes-btn locked" id="yesButton" type="button">Yes</button>
          <button class="no-btn" id="noButton" type="button">No</button>
        </div>
      </div>
    </section>

    <section class="story-screen hidden" id="storyScreen" aria-live="polite">
      <section class="photo-story" id="photoStory">
        <div class="photo-side">
          <button class="photo-frame" id="photoFrame" type="button" aria-label="Go to next photo">
            <img id="memoryPhoto" src="assets/memory-01.jpg" alt="Daniel and Ariane memory">
          </button>
          <p class="tap-hint">Tap the photo to continue</p>
        </div>

        <article class="message-side">
          <p id="typedMessage"></p>
          <button class="next-text-btn" id="nextButton" type="button">Next</button>
        </article>
      </section>

      <section class="ending hidden" id="ending">
        <div class="ending-photo">
          <img src="assets/memory-21-final.jpg" alt="Daniel and Ariane school memory">
        </div>
        <div class="ending-message">
          <p class="tiny">Thank you, my love</p>
          <div class="letter-text" id="endingLetter"></div>
          <button class="restart-btn" id="restartButton" type="button">View again</button>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
